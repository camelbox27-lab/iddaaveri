name: "Güncel: 2026-05-14 → Bugün (eksik günler)"

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: 'latest'

      - uses: browser-actions/setup-geckodriver@latest

      - name: Restore previous data
        uses: actions/download-artifact@v4
        with:
          name: guncel-2026-05-bugun
          path: output/
        continue-on-error: true

      - name: Run scraper (2026-05-14 → bugün)
        run: |
          mkdir -p output
          TODAY=$(date +'%Y-%m-%d')
          echo "Hedef: 2026-05-14 → $TODAY"
          python scraper_cli.py \
            --start 2026-05-14 \
            --end $TODAY \
            --output output/guncel_2026_05_bugun.xlsx \
            --max-hours 5.5 \
            --resume

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guncel-2026-05-bugun
          path: |
            output/guncel_2026_05_bugun.xlsx
            progress_guncel_2026_05_bugun.json
          retention-days: 90
          overwrite: true

      - name: Commit to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/guncel_2026_05_bugun.xlsx progress_guncel_2026_05_bugun.json || true
          git diff --staged --quiet || git commit -m "guncel: 2026-05-14 → bugun $(date +'%Y-%m-%d %H:%M')"
          git push || true
