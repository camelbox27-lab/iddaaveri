name: "Güncel: 2026-03-16 → 2026-05-14"

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: 'latest'

      - uses: browser-actions/setup-geckodriver@latest

      - name: Restore previous progress
        uses: actions/download-artifact@v4
        with:
          name: guncel-2026-03-2026-05
          path: output/
        continue-on-error: true

      - name: Restore progress file
        uses: actions/download-artifact@v4
        with:
          name: guncel-2026-03-2026-05-progress
          path: ./
        continue-on-error: true

      - name: Run scraper
        run: |
          mkdir -p output
          python scraper_cli.py \
            --start 2026-03-16 \
            --end 2026-05-14 \
            --output output/guncel_2026_03_2026_05.xlsx \
            --max-hours 5.5 \
            --resume

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guncel-2026-03-2026-05
          path: output/guncel_2026_03_2026_05.xlsx
          retention-days: 90
          overwrite: true

      - name: Upload progress file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guncel-2026-03-2026-05-progress
          path: progress_guncel_2026_03_2026_05.json
          retention-days: 90
          overwrite: true

      - name: Commit to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/guncel_2026_03_2026_05.xlsx progress_guncel_2026_03_2026_05.json || true
          git diff --staged --quiet || git commit -m "guncel veri: 2026-03/2026-05 $(date +'%Y-%m-%d %H:%M')"
          git push || true
