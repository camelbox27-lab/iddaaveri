name: "Patch: Eksik IY/MS Skorlari Doldur"

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests pandas openpyxl beautifulsoup4

      - name: Restore patched file (resume)
        uses: actions/download-artifact@v4
        with:
          name: patch-clean-excel
          path: output/
        continue-on-error: true

      - name: Restore progress file
        uses: actions/download-artifact@v4
        with:
          name: patch-progress
          path: ./
        continue-on-error: true

      - name: Download main excel via GitHub API (LFS/large file)
        run: |
          mkdir -p output
          # Onceki patch'li dosya zaten varsa kullan
          if [ -f output/iddaagecmismaclar_patched.xlsx ]; then
            echo "Patched dosya mevcut, resume yapilacak"
          elif [ -f output/iddaagecmismaclar_clean.xlsx ]; then
            echo "Clean dosya mevcut"
          else
            echo "Ana Excel bulunamadi - GitHub Releases veya LFS'den indirmeyi dene"
            # Repodaki output/ klasorunden indirmeyi dene (git lfs varsa)
            git lfs pull --include="output/iddaagecmismaclar_clean.xlsx" 2>/dev/null || true
            # Hala yoksa ham xlsx'i dene
            if [ ! -f output/iddaagecmismaclar_clean.xlsx ]; then
              curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -L "https://raw.githubusercontent.com/camelbox27-lab/iddaaveri/main/output/iddaagecmismaclar_clean.xlsx" \
                -o output/iddaagecmismaclar_clean.xlsx 2>/dev/null || true
            fi
            ls -lh output/ || true
          fi

      - name: Run patch script
        run: |
          mkdir -p output
          # Girdi secimi: patched > clean > ham
          INPUT="output/iddaagecmismaclar_clean.xlsx"
          if [ -f output/iddaagecmismaclar_patched.xlsx ]; then
            INPUT="output/iddaagecmismaclar_patched.xlsx"
            echo "Girdi: patched (resume)"
          fi
          python scripts/patch_missing_scores.py \
            --input "$INPUT" \
            --output output/iddaagecmismaclar_patched.xlsx \
            --progress progress_patch.json \
            --max-hours 5.5 \
            --workers 6 \
            --resume

      - name: Upload patched Excel
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patch-clean-excel
          path: output/iddaagecmismaclar_patched.xlsx
          retention-days: 90
          overwrite: true

      - name: Upload progress file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patch-progress
          path: progress_patch.json
          retention-days: 90
          overwrite: true

      - name: Commit to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/iddaagecmismaclar_patched.xlsx progress_patch.json || true
          git diff --staged --quiet || git commit -m "patch: eksik IY/MS skorlar guncellendi $(date +'%Y-%m-%d %H:%M')"
          git push || true
